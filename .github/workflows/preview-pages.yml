# Pre-merge showcase of the Wasm web bundle on GitHub Pages. Independent of
# release.yml: no tag, no GitHub Release, no signing, no desktop/Android builds.
# This file will be deleted once the feature branch is merged - release.yml handles
# versioned Pages deploys from main.

name: Preview Pages

on:
  workflow_dispatch:
  push:
    branches:
      - github-ci

concurrency:
  group: preview-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-web:
    name: Build Wasm web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build web distribution
        # Development distribution skips the Kotlin/Wasm IR optimize pass that
        # makes production builds take 30+ min on CI. Bundle is larger, but
        # that's an acceptable tradeoff for preview demo
        run: ./gradlew :ohs-player-reference-app:wasmJsBrowserDevelopmentExecutableDistribution \
          -Pkotlin.daemon.jvmargs="-Xmx10g -XX:+UseParallelGC"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ohs-player-reference-app/build/dist/wasmJs/developmentExecutable

  deploy:
    name: Deploy to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
